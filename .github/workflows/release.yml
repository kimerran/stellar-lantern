name: Release build (main)

# On every merge to main (the release branch), build all *working* features into
# the shipped artifacts: the Chrome extension zip + the Android APK. "Working"
# is defined by the build-time feature flags (#81) — shipped-core ON, and
# anything external / unfinished / demo-only OFF so it dead-code-eliminates out
# of a release build. android.yml stays the per-PR check; this is the main build.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main supersedes an in-flight release build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` is what creating the GitHub Release needs (#130); nothing
# else here writes to the repo.
permissions:
  contents: write

# Working-feature flag set for the release build. Set explicitly (not relying on
# the source defaults) so what ships from main is reproducible and reviewable
# here. Flip a flag ON once its feature is verified end-to-end.
env:
  VITE_FEATURE_SWAP: 'true'            # in-wallet swaps (#71) — shipped
  VITE_FEATURE_EARN_BLEND: 'true'      # Blend supply/withdraw (#21) — shipped
  VITE_FEATURE_ANCHORS: 'true'         # SEP-24 cash in/out (#24) — shipped
  VITE_FEATURE_MINIAPPS: 'true'        # dApp mini-apps — shipped
  VITE_FEATURE_SWAP_AGGREGATOR: 'true' # Soroswap aggregator (#71) — on; needs SOROSWAP_API_KEY secret, else falls back to native SDEX
  VITE_FEATURE_BIOMETRIC_UNLOCK: 'true'  # #23 M2a — active on Android; inert on web (store unavailable)
  VITE_FEATURE_GEOVELOCITY: 'false'    # #70 — no code (closed not-planned)
  VITE_FEATURE_DEMO_AFFORDANCES: 'false' # demo-only bits — never in a release build
  VITE_FEATURE_PASSKEY: 'false'        # #53 — passkey smart accounts; experimental, testnet-only, off in release
  VITE_FEATURE_SCANNER_AI: 'true'      # #59 / #84 — the hosted explainer's sentence, served by the Lantern API; no key ships (the key stays server-side)
  VITE_FEATURE_TELEMETRY: 'true'       # #81 — opt-in usage analytics (#88); consent-gated in-app, default OFF for the user
  VITE_FEATURE_TELEMETRY_IDENTITY: 'true' # #100 — ALPHA ONLY: attaches the wallet address to telemetry. Set to 'false' before any store submission.
  # Telemetry ingest (a URL, not a secret): the Lantern API on Railway. Its
  # origin is also in manifest host_permissions. Change both together.
  VITE_TELEMETRY_INGEST_URL: 'https://lantern-api-production-3fad.up.railway.app/v1/telemetry'
  # The Lantern API base (#84): the scanner's explainer proxy at /v1/explain. Same
  # origin as the ingest URL, so the manifest already grants it.
  VITE_LANTERN_API_URL: 'https://lantern-api-production-3fad.up.railway.app'
  # Soroswap aggregator config (values/secrets, not feature flags). The API key is
  # a secret; the referral wallet + fee are optional — revenue share is only
  # charged when BOTH are set. All unset → the aggregator falls back to native SDEX.
  VITE_SOROSWAP_API_KEY: ${{ secrets.SOROSWAP_API_KEY }}
  VITE_SOROSWAP_REFERRAL_ID: ${{ vars.SOROSWAP_REFERRAL_ID }}
  VITE_SOROSWAP_FEE_BPS: ${{ vars.SOROSWAP_FEE_BPS }}

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Release gates — verify before building the shipped artifacts.
      # The version must be newer than every Release from this repo (#141), so
      # two releases never share asset names. The bump is `npm run
      # version:bump`, committed on develop and carried here by the release
      # PR (release-gate.yml says why CI does not bump). Push only: a
      # workflow_dispatch rebuild of a released version stays allowed.
      - name: Release version is new
        if: github.event_name == 'push'
        run: npm run version:check

      - name: Test
        run: npm test

      - name: Prove disabled features are stripped
        run: npm run verify:flags

      # ── Chrome extension (dist/ → release/*.zip) ──
      - name: Build & package extension
        run: npm run package

      # ── Android APK (dist-mobile/ → app-debug.apk) ──
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Same pin as android.yml (#74): the action's default package list
          # requests the legacy `tools` package the SDK repository no longer
          # serves, and sdkmanager exits 1 before Gradle runs.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build mobile web assets
        run: npm run build:mobile

      - name: Sync Capacitor
        run: npx cap sync android

      # The persistent signing key (#171): every release APK is signed with the
      # same certificate so it installs over the previous build in place.
      # internal-lantern publishes the Releases, so a missing key there fails
      # the run rather than quietly shipping a throwaway-key APK. The mirror
      # has no key and builds with the runner's debug key (artifacts only).
      - name: Decode APK signing key
        env:
          KEYSTORE_B64: ${{ secrets.LANTERN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "${{ github.repository }}" = "kimerran/internal-lantern" ]; then
              echo "::error::LANTERN_KEYSTORE_BASE64 is not set; refusing to publish a throwaway-key APK (#171)"
              exit 1
            fi
            echo "No signing key on this repo; the APK is signed with the runner's debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lantern.jks"
          echo "LANTERN_KEYSTORE_FILE=$RUNNER_TEMP/lantern.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          LANTERN_KEYSTORE_PASSWORD: ${{ secrets.LANTERN_KEYSTORE_PASSWORD }}
          LANTERN_KEY_ALIAS: ${{ secrets.LANTERN_KEY_ALIAS }}
          LANTERN_KEY_PASSWORD: ${{ secrets.LANTERN_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleDebug --no-daemon

      # Record the certificate in the log so two releases can be compared.
      - name: Print APK signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'SHA-256|DN:'
          rm -f "$RUNNER_TEMP/lantern.jks"

      # ── Stage the release assets under human names (#130) ──
      # The packager writes release/<name>-<version>.zip; the APK comes out of
      # Gradle as app-debug.apk. stage-release.mjs copies both to release/assets/
      # as lantern-<version>-testnet.apk + lantern-extension-<version>.zip,
      # writes SHA256SUMS.txt and RELEASE_NOTES.md (version, commit, the
      # VITE_FEATURE_* set above), and prints the tag/name for the step below.
      - name: Stage release assets
        id: stage
        run: |
          ZIP=$(ls release/*.zip | head -n 1)
          node scripts/stage-release.mjs \
            --apk android/app/build/outputs/apk/debug/app-debug.apk \
            --zip "$ZIP" --out release/assets \
            --sha "${{ github.sha }}" --run "${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          cat release/assets/SHA256SUMS.txt

      # ── Publish: a GitHub Release with directly downloadable assets ──
      # GitHub serves each asset under its own name with no re-zipping, so the
      # APK downloads as an .apk and installs on tap. Tagged
      # v<version>-testnet.<run> so repeated merges of one version don't
      # collide. Pre-release: it is the alpha (debug-signed APK, telemetry
      # identity on).
      #
      # Published by internal-lantern ONLY (#153). This file is shared with the
      # public mirror, which still builds and uploads the run artifacts below
      # but no longer publishes Releases: the private Releases are the single
      # source for /download/*, read by lantern-api with a token, and
      # /download/checksums is how anyone verifies a build. On the mirror the
      # release gate's tags therefore stop at v0.2.0; internal-lantern's tags
      # are the ones that enforce the version bump.
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.repository == 'kimerran/internal-lantern'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: ${{ steps.stage.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: release/assets/RELEASE_NOTES.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            release/assets/lantern-*-testnet.apk
            release/assets/lantern-extension-*.zip
            release/assets/SHA256SUMS.txt

      # ── Keep the run artifacts too (debugging a specific run; not distribution) ──
      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: extension-release
          path: release/*.zip
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # The Lantern API deploys with the clients (#104). Before this, the server was
  # deployed by hand and lagged the clients (#100: the old validator rejected the
  # new envelopes). Same staged `railway up` as scripts/deploy-lantern-api.sh;
  # the script waits on /healthz so a broken deploy fails the run. Needs the
  # RAILWAY_TOKEN repository secret (a Railway project token for the `lantern`
  # project); without it the job is skipped, not failed.
  deploy-api:
    needs: release-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy lantern-api
        if: env.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bash scripts/deploy-lantern-api.sh
      - name: Skipped (no RAILWAY_TOKEN)
        if: env.RAILWAY_TOKEN == ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: echo "RAILWAY_TOKEN secret not set — API not deployed from CI; run scripts/deploy-lantern-api.sh by hand."
