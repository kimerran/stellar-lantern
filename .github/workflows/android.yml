name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.config.mobile.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:mobile
        env:
          # The debug APK is the testnet testing artifact, so enable the
          # experimental passkey smart accounts (#53) here for on-device testnet
          # testing. The shipped release build (release.yml) keeps it OFF.
          VITE_FEATURE_PASSKEY: 'true'
          # Opt-in usage analytics (#81 / #88): on in the testnet debug build
          # too, so the alpha APK reports — consent-gated in-app, default OFF.
          VITE_FEATURE_TELEMETRY: 'true'
          VITE_TELEMETRY_INGEST_URL: 'https://lantern-api-production-3fad.up.railway.app/v1/telemetry'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still asks sdkmanager for the
          # legacy `tools` package, which the SDK repository no longer serves
          # ("Failed to find package 'tools'", exit 1 — every run since
          # 2026-09-15). Pin exactly what android/variables.gradle needs
          # (compileSdk 36); Gradle fetches any further build-tools itself
          # under the licenses the action accepts.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
