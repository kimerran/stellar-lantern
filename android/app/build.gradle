apply plugin: 'com.android.application'

// The version comes from package.json — the one place it is written (#141) —
// so the APK reports the same version as the extension manifest and the
// telemetry appVersion. versionCode must strictly increase for Android to
// treat a build as an upgrade: major*10000 + minor*100 + patch is monotonic
// across bumps and reproducible from the source tree (github.run_number is
// neither). Same formula as versionCode() in scripts/release-assets.mjs.
def lanternVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def lanternVersionCode = { String v ->
    def (major, minor, patch) = v.tokenize('-')[0].tokenize('.').collect { it as int }
    major * 10000 + minor * 100 + patch
}

android {
    namespace = "com.lantern.wallet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lantern.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode lanternVersionCode(lanternVersion)
        versionName lanternVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // One persistent signing key for the alpha/testnet builds (#171). Without
    // it the debug APK is signed by whatever debug keystore the machine has —
    // a fresh one on every CI runner — so each release had a new certificate
    // and Android refused to install it over the previous one. release.yml
    // decodes the key from Actions secrets into LANTERN_KEYSTORE_FILE; local
    // and PR builds have no such env and keep the machine's debug key.
    def lanternKeystore = System.getenv('LANTERN_KEYSTORE_FILE')
    signingConfigs {
        if (lanternKeystore) {
            lantern {
                storeFile file(lanternKeystore)
                storePassword System.getenv('LANTERN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LANTERN_KEY_ALIAS')
                keyPassword System.getenv('LANTERN_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (lanternKeystore) signingConfig signingConfigs.lantern
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
